version: '3.8'

services:
  # Frontend (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - maxnews-network
    restart: unless-stopped

  # Backend (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - MAXSTAT_API_KEY=${MAXSTAT_API_KEY:?MAXSTAT_API_KEY is required}
      - MAXSTAT_API_URL=${MAXSTAT_API_URL:-https://api.maxstat.ru/v1}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN:?MAX_BOT_TOKEN is required}
      - MAX_CHANNEL_ID=${MAX_CHANNEL_ID:?MAX_CHANNEL_ID is required}
      # AI провайдеры (опционально)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - YANDEX_IAM_TOKEN=${YANDEX_IAM_TOKEN:-}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maxnews-network
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    # НЕ публикуем порт наружу для безопасности
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-maxnews}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-maxnews}
    volumes:
      - postgres_/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxnews}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maxnews-network
    restart: unless-stopped

  # Redis (для BullMQ)
  redis:
    image: redis:7-alpine
    # НЕ публикуем порт наружу для безопасности
    # ports:
    #   - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maxnews-network
    restart: unless-stopped

  # Redis Commander (опционально, для просмотра Redis)
  # Доступ только через VPN/SSH tunnel
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "127.0.0.1:8081:8081"  # Только localhost
    environment:
      - REDIS_HOSTS=local:redis:6379?password=${REDIS_PASSWORD:-redis_secret}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - maxnews-network
    profiles:
      - tools

  # Adminer (опционально, для просмотра PostgreSQL)
  # Доступ только через VPN/SSH tunnel
  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:8082:8080"  # Только localhost
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - maxnews-network
    profiles:
      - tools

volumes:
  postgres_
  redis_

networks:
  maxnews-network:
    driver: bridge
