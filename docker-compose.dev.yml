version: '3.8'

# Docker Compose для разработки
# Использует hot-reload и монтирует исходники

services:
  # Frontend (Vite dev server)
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - maxnews-network

  # Backend (NestJS dev server)
  backend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npm run start:dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://maxnews:maxnews_secret@postgres:5432/maxnews
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maxnews-network

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=maxnews
      - POSTGRES_PASSWORD=maxnews_secret
      - POSTGRES_DB=maxnews
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxnews"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maxnews-network

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maxnews-network

  # Redis Commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - maxnews-network

  # Adminer
  adminer:
    image: adminer:latest
    ports:
      - "8082:8080"
    networks:
      - maxnews-network

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  maxnews-network:
    driver: bridge
